# ==============================================================================
# DOCKER COMPOSE - HỆ THỐNG ĐẨY CỔNG KHÁM SỨC KHỎE QUỐC GIA (KSK PORTAL GATEWAY)
# Cách chạy: docker compose up -d --build
# ==============================================================================

services:
  ksk-gateway-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ksk-gateway-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8790}:8790"
    env_file:
      - ./server/.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PORT=8790
      - DATA_DIR=/app/server/data
    volumes:
      - ./server/data:/app/server/data
      - ./client/dist-release:/app/client/dist-release
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ksk-gateway-net

  ksk-gateway-web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ksk-gateway-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3090}:80"
    depends_on:
      - ksk-gateway-server
    networks:
      - ksk-gateway-net

networks:
  ksk-gateway-net:
    driver: bridge
